# This is a throwaway local rig with nothing in it worth protecting, and MAS limits logins to a
# small burst per IP by default, which a suite that logs in for each case exhausts part way through.
rate_limiting:
  login:
    per_ip:
      burst: 1000
      per_second: 1000.0
    per_account:
      burst: 1000
      per_second: 1000.0
  registration:
    burst: 1000
    per_second: 1000.0

passwords:
  enabled: true
  schemes:
  - version: 1
    algorithm: argon2id
  minimum_complexity: 0
matrix:
  kind: synapse
  homeserver: localhost
  secret: WDvjBfSCOqkvjHcideUlPg8xGxvoJRJd
  endpoint: http://oauth-synapse:8008/
