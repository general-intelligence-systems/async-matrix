# Configuration for matrix-authentication-service, which serves the OAuth 2.0 API that Synapse
# delegates to when `matrix_authentication_service` is enabled.
#
# Generated by `mas-cli config generate` and then pointed at this rig: the keys and the shared
# secret below are throwaway, for a local server with nothing in it worth protecting.
#
# `public_base` is the address a client reaches MAS on, because the URLs MAS advertises through
# the metadata are built from it. Synapse reaches it by its service name instead.

http:
  listeners:
  - name: web
    resources:
    - name: discovery
    - name: human
    - name: oauth
    - name: compat
    - name: graphql
    - name: assets
    binds:
    - address: '[::]:8080'
    proxy_protocol: false
  - name: internal
    resources:
    - name: health
    binds:
    - host: localhost
      port: 8081
    proxy_protocol: false
  trusted_proxies:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/10
  - 127.0.0.1/8
  - fd00::/8
  - ::1/128
  public_base: http://localhost:8091/
  issuer: http://localhost:8091/
database:
  uri: postgresql://mas:mas@oauth-postgres:5432/mas
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
email:
  from: '"Authentication Service" <root@localhost>'
  reply_to: '"Authentication Service" <root@localhost>'
  transport: blackhole
