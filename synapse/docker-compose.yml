# The test rig: one service per Matrix specification version, each running the Synapse which
# implements that version. The images are built and published by flake.nix in this directory.
#
#   docker compose up --detach --wait v1.11
#
# Only one runs at a time - they all bind the same port - so bin/test brings each up in turn. The
# service name is the specification version, so starting the right server is just naming it.
#
# Each version mounts its own homeserver.<version>.yaml, generated from homeserver.yaml: an older
# Synapse rejects settings a newer one accepts, so the configuration is versioned alongside the
# server. MATRIX_API_VERSIONS.txt is generated from the services below.

# Every server here which is not a homeserver carries a compose profile named for the API it serves:
# `identity` is sydent, `push-gateway` is sygnal, `application-service` is the stub which answers in
# a bridge's place, and `client-server` is the OAuth 2.0 stack. That is how the rig declares what it
# has, and it is the whole of what bin/test knows about this file - it enables the profiles of the
# APIs it was asked for and never names a service:
#
#   docker compose --profile identity up --detach --wait
#
# A backend whose rig has no server for an API declares no profile for it, and asking for that API
# there is then a run of nothing. Which APIs this rig can serve is declared in test.env.
#
# A service which runs once and exits rather than serving goes in the `<api>-seed` profile instead,
# so that it is run after that API's servers are up rather than waited on: `docker compose up
# --wait` counts a container which has exited as a failure, however it exited.
#
# The profiles also keep these services out of `docker compose config --services`, so
# MATRIX_API_VERSIONS.txt stays a list of specification versions. They bind their own ports, so they
# run alongside whichever version is up.

# A fixed project name, so that `docker compose down` finds the rig whatever directory it is run
# from, rather than deriving a different project per working directory.
name: async-matrix

x-synapse: &synapse
  # Always ask the registry, because the tag is rebuilt rather than retired: synapse:spec-v1.3 is
  # "the Synapse which implements Matrix v1.3", and it points at a different Synapse whenever
  # flake.nix changes which one that is. Without this, a run reuses whatever was pulled last and
  # tests the version mapping of the day it was pulled, which fails in ways that read as library
  # bugs. A pull of an unchanged tag costs one manifest request, since the layers are cached.
  pull_policy: always
  environment:
    SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    PYTHONPATH: /config/modules
  ports:
    - "${HOMESERVER_PORT:-7300}:8008"
    # The identity server and the TLS terminator in front of federation share this namespace, so
    # their ports are published here: a container which joins another's namespace cannot publish
    # one of its own. The published ports all sit in an unused range, clear of the defaults
    # services pick for themselves.
    - "${SYDENT_PORT:-7302}:8090"
  # The database and the media store, which homeserver.yaml puts under /tmp.
  #
  # In memory, because the rig's database is thrown away with the container either way, and on disk
  # it is what the suite spends its time on: SQLite fsyncs per transaction, and a createRoom is
  # fifty persisted events, which costs about 2.7 seconds against the container's overlay
  # filesystem. Every case which touches a room pays that, and the ones which give up waiting are
  # the `Connection from client lost before response was sent` in the homeserver's log.
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/_matrix/client/versions || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 30

x-volumes:
  signing-key: &signing-key ./signing.key:/config/signing.key:ro
  modules: &modules ./modules:/config/modules:ro
  appservice-registration: &appservice-registration ./appservice.yaml:/config/appservice.yaml:ro

services:
  v1.1:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.1
    volumes:
      - ./homeserver.v1_1.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.2:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.2
    volumes:
      - ./homeserver.v1_2.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.3:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.3
    volumes:
      - ./homeserver.v1_3.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.4:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.4
    volumes:
      - ./homeserver.v1_4.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.5:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.5
    volumes:
      - ./homeserver.v1_5.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.6:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.6
    volumes:
      - ./homeserver.v1_6.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.7:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.7
    volumes:
      - ./homeserver.v1_7.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.8:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.8
    volumes:
      - ./homeserver.v1_8.yaml:/config/homeserver.yaml:ro
