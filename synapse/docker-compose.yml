      - *modules

  v1.13:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.13
    volumes:
      - ./homeserver.v1_13.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules

  v1.14:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.14
    volumes:
      - ./homeserver.v1_14.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules

  v1.15:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.15
    volumes:
      - ./homeserver.v1_15.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules

  v1.16:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.16
    volumes:
      - ./homeserver.v1_16.yaml:/config/homeserver.yaml:ro
