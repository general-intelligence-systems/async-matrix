    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.18
    volumes:
      - ./homeserver.v1_18.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  v1.19:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.19
    volumes:
      - ./homeserver.v1_19.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules
      - *appservice-registration

  # The identity server, which answers the identity service API: it holds which address belongs to
  # which user, so that a client can invite somebody it has only an address for. A homeserver does
  # not answer those paths, which is why this is a server of its own.
  #
  # One service rather than one per version: every operation the identity API defines is in all of
  # the versions this rig covers, so there is nothing to vary. It binds its own port, so it runs
  # alongside whichever homeserver version is up.
  # Terminates TLS in front of the homeserver, on the federation port.
  #
  # The identity server verifies an OpenID token by asking the homeserver over federation, which is
  # HTTPS: `use_tls_for_federation` is an argument to Sydent's constructor rather than a setting,
  # and only its own test harness passes false. The homeserver speaks plain HTTP, so this sits in
  # front of it. It joins the homeserver's network namespace, so 8448 and 8008 are the same
  # `localhost` - which is what the homeserver calls itself, and so what the identity server has to
  # resolve.
  federation-tls:
    profiles: [identity]
    image: alpine/socat:latest
    network_mode: "service:${MATRIX_SERVICE:-v1.19}"
    volumes:
      - ./tls:/config/tls:ro
    command:
      - OPENSSL-LISTEN:8448,reuseaddr,fork,cert=/config/tls/federation.pem,verify=0
      - TCP:127.0.0.1:8008

  sydent:
    profiles: [identity]
    image: ${SYDENT_IMAGE:-matrixdotorg/sydent:latest}
    pull_policy: always
    # The same namespace as the homeserver, so that the name the homeserver calls itself resolves
    # to it from here. Its port is published by the homeserver, above.
    network_mode: "service:${MATRIX_SERVICE:-v1.19}"
    depends_on:
      - federation-tls
    environment:
      SYDENT_CONF: /config/sydent.conf
    volumes:
      - ./sydent.conf:/config/sydent.conf:ro
      - ./sydent-terms.yaml:/config/sydent-terms.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/_matrix/identity/v2')\""]
      interval: 3s
      timeout: 3s
      retries: 30

  # The push gateway, which a homeserver calls to have a notification delivered.
  #
  # No applications are configured, so a notification is one it rejects: see sygnal.yaml. It binds
  # its own port, so it runs alongside whichever homeserver version is up.
  sygnal:
    profiles: [push-gateway]
    image: ${SYGNAL_IMAGE:-matrixdotorg/sygnal:latest}
    pull_policy: always
    environment:
      SYGNAL_CONF: /config/sygnal.yaml
    volumes:
      - ./sygnal.yaml:/config/sygnal.yaml:ro
    ports:
      - "${SYGNAL_PORT:-7303}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 5000), 2)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  # An application service, in as little as answers the specification: see appservice-stub.py.
  #
  # The application service API is served by a bridge, and every bridge is a bridge to something.
  # The rig runs none, so this answers in its place - which is enough for the operations, since each
  # is a request whose shape the suite is checking and whose answer it reads.
  appservice:
    # Also up for a client-server run, because every homeserver now registers it: a registration
    # whose `url` answers nothing leaves the homeserver retrying each transaction into the log.
    profiles: [application-service, client-server]
    image: python:3-slim
    command: ["python", "/config/appservice-stub.py"]
    volumes:
      - ./appservice-stub.py:/config/appservice-stub.py:ro
    ports:
      - "${APPSERVICE_PORT:-7305}:8099"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/_matrix/app/v1/thirdparty/protocols')\""]
      interval: 3s
      timeout: 3s
      retries: 30

  # The OAuth 2.0 stack. MAS stores its state in PostgreSQL, which it requires, and Synapse
  # delegates authentication to it.

  oauth-postgres:
    profiles: [client-server]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username mas --dbname mas"]
      interval: 2s
      timeout: 3s
      retries: 30

  oauth-mas:
    profiles: [client-server]
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    command: ["server", "--config", "/config/mas.yaml"]
    depends_on:
      oauth-postgres:
        condition: service_healthy
    volumes:
      - ./mas.yaml:/config/mas.yaml:ro
    ports:
      - "${MAS_PORT:-7301}:8080"

  # Registers the user the OAuth suite logs in as. MAS has no equivalent of the version rig's
  # register-on-first-login module, so the user is seeded once, here.
  #
  # It waits for the homeserver, not just the database: registering a user provisions it into
  # Synapse as well, and a user seeded while the homeserver was down exists in MAS alone. The
  # authorization server then refuses every exchange, because the device it must create belongs
  # to a user the homeserver has never heard of.
  oauth-mas-user:
    profiles: [client-server-seed]
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    restart: "no"
    command:
      - manage
      - register-user
      - --config
      - /config/mas.yaml
      - --yes
      - --ignore-password-complexity
      - --password
      - "${MATRIX_OAUTH_PASSWORD:-password}"
      - "${MATRIX_OAUTH_USERNAME:-oauthtester}"
    depends_on:
      oauth-synapse:
        condition: service_healthy
    volumes:
      - ./mas.yaml:/config/mas.yaml:ro

  oauth-synapse:
    profiles: [client-server]
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.19
    pull_policy: always
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    depends_on:
      - oauth-mas
    ports:
      - "${OAUTH_SYNAPSE_PORT:-7310}:8008"
    volumes:
      - ./homeserver.oauth.yaml:/config/homeserver.yaml:ro
      - ./signing.key:/config/signing.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/_matrix/client/versions || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
