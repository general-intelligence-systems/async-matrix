      - *modules

  v1.10:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.10
    volumes:
      - ./homeserver.v1_10.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules

  v1.11:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.11
    volumes:
      - ./homeserver.v1_11.yaml:/config/homeserver.yaml:ro
      - *signing-key
      - *modules

  v1.12:
    <<: *synapse
    image: ghcr.io/${IMAGE_OWNER:-n-at-han-k}/synapse:spec-v1.12
    volumes:
