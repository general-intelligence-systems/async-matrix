name: Test

# The whole suite, which is the core and then each API.
#
# The core is everything the APIs are built from - the wrappers, the versioning, the events, the
# credentials - and is run here. Each API has a workflow of its own, which this calls: they are what
# a job name says, so a failure reads as `Test identity / matrix v1.11` rather than as one job among
# three hundred. Each can also be run on its own from the Actions tab.
#
# Ruby comes from ruby/setup-ruby rather than the flake: the devShell pins one Ruby through
# bundlerEnv, so it cannot vary per job.

on:
  push:
    branches:
      - async-rest
  pull_request:
    branches:
      - async-rest
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Without the lint group: the suite does not lint, and the cops need Ruby 4, so installing them
# would fail the older Rubies before a test could run. See the Gemfile.
#
# At the workflow level, rather than on the setup-ruby step which installs them: BUNDLE_WITHOUT is
# read from the environment and is not written to .bundle/config, so a step which does not see it
# makes `bundle exec` demand the lint gems the install skipped, and Bundler fails with GemNotFound.
env:
  BUNDLE_WITHOUT: lint

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.resolve.outputs.matrix}}
    steps:
    - uses: actions/checkout@v5
    
    # MATRIX_API_VERSIONS.txt is generated from the compose file by the Update Matrix Versions List
    # workflow, and is what bin/test reads too.
    - id: resolve
      name: Resolve versions from MATRIX_API_VERSIONS.txt
      run: |
        if [ ! -s MATRIX_API_VERSIONS.txt ]; then
          echo "::error::MATRIX_API_VERSIONS.txt is missing or empty."
          exit 1
        fi
        
        cat MATRIX_API_VERSIONS.txt
        
        echo "matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < MATRIX_API_VERSIONS.txt)" >> "$GITHUB_OUTPUT"

  core:
    name: core / ruby ${{matrix.ruby}} / matrix ${{matrix.version}}
    needs: versions
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
        version: ${{fromJSON(needs.versions.outputs.matrix)}}
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true
    
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    
    - name: Test
      timeout-minutes: 20
      env:
        IMAGE_OWNER: ${{github.repository_owner}}
      run: bin/test --core ${{matrix.version}}
    
    - name: Homeserver logs
      if: failure()
      run: docker compose --file synapse/docker-compose.yml logs --no-color | tail -100

  client-server:
    name: client-server
    uses: ./.github/workflows/test-client-server.yaml
    secrets: inherit

  identity:
    name: identity
    uses: ./.github/workflows/test-identity.yaml
    secrets: inherit

  server-server:
    name: server-server
    uses: ./.github/workflows/test-server-server.yaml
    secrets: inherit

  application-service:
    name: application-service
    uses: ./.github/workflows/test-application-service.yaml
    secrets: inherit

  push-gateway:
    name: push-gateway
    uses: ./.github/workflows/test-push-gateway.yaml
    secrets: inherit
