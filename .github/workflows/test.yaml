name: Test

# Runs the suite across two dimensions: the Ruby version it runs on, and the Matrix specification
# version it talks to. The images come from the Build Test Images workflow, and
# synapse/docker-compose.yml has a service per specification version, so a job is just
# `bin/test v1.11`.
#
# The matrix keys are ordered for the sake of the job names - `ruby 3.4 / matrix v1.11` - the set of
# jobs is the product either way round.
#
# Ruby comes from ruby/setup-ruby rather than the flake: the devShell pins one Ruby through
# bundlerEnv, so it cannot vary per job.

on:
  push:
    branches:
      - async-rest
  pull_request:
    branches:
      - async-rest
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.resolve.outputs.matrix}}
    steps:
    - uses: actions/checkout@v5
    
    # MATRIX_API_VERSIONS.txt is generated from the compose file by the Update Matrix Versions List
    # workflow, and is what bin/test reads too.
    - id: resolve
      name: Resolve versions from MATRIX_API_VERSIONS.txt
      run: |
        if [ ! -s MATRIX_API_VERSIONS.txt ]; then
          echo "::error::MATRIX_API_VERSIONS.txt is missing or empty."
          exit 1
        fi
        
        cat MATRIX_API_VERSIONS.txt
        
        echo "matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < MATRIX_API_VERSIONS.txt)" >> "$GITHUB_OUTPUT"

  test:
    name: ruby ${{matrix.ruby}} / matrix ${{matrix.version}}
    needs: versions
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
        version: ${{fromJSON(needs.versions.outputs.matrix)}}
    
    steps:
    - uses: actions/checkout@v5
    
    # Without the lint group: the suite does not lint, and the cops need Ruby 4, so installing them
    # would fail the older Rubies before a test could run. See the Gemfile.
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true
      env:
        BUNDLE_WITHOUT: lint
    
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    
    - name: Test
      timeout-minutes: 20
      env:
        IMAGE_OWNER: ${{github.repository_owner}}
      run: bin/test ${{matrix.version}}
    
    - name: Homeserver logs
      if: failure()
      run: docker compose --file synapse/docker-compose.yml logs --no-color | tail -100
