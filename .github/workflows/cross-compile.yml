name: Cross Compile

# Builds precompiled, per-platform native gems (with the Rust/vodozemac .so
# already inside) and pushes them to RubyGems. This is what lets end users run
# `gem install async-matrix` WITHOUT a Rust toolchain: RubyGems serves them the
# fat gem matching their platform instead of the compile-from-source gem.
#
# Triggered on version tags (e.g. v2.1.0). Tag after `bin/increment-version`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    name: Fetch CI data
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: true
          stable-ruby-versions: |
            exclude: [head]

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  publish:
    name: Push gems to RubyGems
    runs-on: ubuntu-latest
    needs: cross-gem
    # Only push for real tag builds, and only when the API key is configured.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: rubygems
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          path: pkg
          merge-multiple: true

      - name: Push all platform gems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY secret not set; skipping push." >&2
            exit 0
          fi
          for gem in pkg/*.gem; do
            echo "Pushing $gem"
            gem push "$gem"
          done
