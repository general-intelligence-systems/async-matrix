name: Test (Tuwunel)

# Runs the suite against tuwunel, one job per Matrix specification version. The images come from
# Build Test Images (Tuwunel), and tuwunel/docker-compose.yml has a service per specification
# version, so a job is just `bin/test --backend tuwunel v1.11`.
#
# This is the second homeserver, and that is the whole point of it: a suite which only ever talks to
# Synapse tests what Synapse does, not what the specification says. Where a version fails here and
# passes there, one of the two servers is wrong, or the specification is read two ways - and that is
# worth knowing either way.
#
# Only one Ruby, where Test runs three. The Ruby dimension is about the gem rather than about the
# homeserver, and Test already covers it across every version; repeating it here would double the
# jobs to say nothing new. It is the one the devShell pins, so a failure here reproduces under
# `nix develop --command bin/test --backend tuwunel <version>` without choosing a Ruby first.

on:
  push:
    branches:
      - async-rest
  pull_request:
    branches:
      - async-rest
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Without the lint group: the suite does not lint, and the cops need Ruby 4, so installing them
# would fail the older Rubies before a test could run. See the Gemfile.
#
# At the workflow level, rather than on the setup-ruby step which installs them: BUNDLE_WITHOUT is
# read from the environment and is not written to .bundle/config, so a step which does not see it
# makes `bundle exec` demand the lint gems the install skipped, and Bundler fails with GemNotFound.
env:
  BUNDLE_WITHOUT: lint

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve the tuwunel versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.resolve.outputs.matrix}}
    steps:
    - uses: actions/checkout@v5

    # MATRIX_API_VERSIONS.txt is generated by the Update Matrix Versions List workflow, which also
    # checks that every backend offers the same versions, and is what bin/test reads too.
    - id: resolve
      name: List the versions the tuwunel suite runs against
      run: |
        if [ ! -s MATRIX_API_VERSIONS.txt ]; then
          echo "::error::MATRIX_API_VERSIONS.txt is missing or empty."
          exit 1
        fi

        cat MATRIX_API_VERSIONS.txt

        echo "matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < MATRIX_API_VERSIONS.txt)" >> "$GITHUB_OUTPUT"

  test:
    name: tuwunel suite / ${{matrix.version}}
    needs: versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{fromJSON(needs.versions.outputs.matrix)}}

    steps:
    - uses: actions/checkout@v5

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler-cache: true

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Run bin/test --backend tuwunel
      timeout-minutes: 20
      env:
        IMAGE_OWNER: ${{github.repository_owner}}
      run: bin/test --backend tuwunel ${{matrix.version}}

    - name: Tuwunel logs for ${{matrix.version}}
      if: failure()
      run: docker compose --file tuwunel/docker-compose.yml logs --no-color | tail -100
