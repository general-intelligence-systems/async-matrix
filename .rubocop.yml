# Note: async-rest also uses rubocop-md, which is not in this project's Gemfile.
plugins:
  - rubocop-socketry

require:
  - ./cops/abstract_module_version_order.rb
  - ./cops/abstract_module_no_changes_comment.rb

AllCops:
  DisabledByDefault: true

# Socketry specific rules:

# Indenting blank lines means trailing whitespace once indentation is spaces rather than tabs:
Layout/ConsistentBlankLineIndentation:
  Enabled: false

Layout/BlockDelimiterSpacing:
  Enabled: true

Style/GlobalExceptionVariables:
  Enabled: true

# General Layout rules:

Layout/IndentationStyle:
  Enabled: true
  EnforcedStyle: spaces

Layout/InitialIndentation:
  Enabled: true

Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: normal

Layout/BlockAlignment:
  Enabled: true

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_line

Layout/BeginEndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_line

Layout/RescueEnsureAlignment:
  Enabled: true

Layout/ElseAlignment:
  Enabled: true

Layout/DefEndAlignment:
  Enabled: true

Layout/CaseIndentation:
  Enabled: true
  EnforcedStyle: end

Layout/CommentIndentation:
  Enabled: true

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/EmptyLinesAroundClassBody:
  Enabled: true

Layout/EmptyLinesAroundModuleBody:
  Enabled: true

Layout/EmptyLineAfterMagicComment:
   Enabled: true

Layout/SpaceInsideBlockBraces:
  Enabled: true
  EnforcedStyle: no_space
  SpaceBeforeBlockParameters: false

Layout/SpaceAroundBlockParameters:
  Enabled: true
  EnforcedStyleInsidePipes: no_space

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

# Project specific rules:

# Every version layer must be declared, even when it changed nothing, and declared highest first.
# The versions come from MATRIX_API_VERSIONS.txt, which is generated from the compose file, so a
# version only has to be added in one place.
AsyncMatrix/AbstractModuleVersionOrder:
  Enabled: true
  Include:
    - "lib/async/matrix/abstract/**/*.rb"

# An empty version layer must say which version it stands for, so that a reader can tell "nothing
# changed here" from "somebody left this unfinished".
AsyncMatrix/AbstractModuleNoChangesComment:
  Enabled: true
  Include:
    - "lib/async/matrix/abstract/**/*.rb"
