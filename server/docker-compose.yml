services:
  # ── Synapse Homeserver ────────────────────────────────────
  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./files:/data
    ports:
      - 8008:8008
      - 8448:8448
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Echo Bot (Appservice) ───────────────────────────────
  bot:
    build:
      context: ../..
      dockerfile: examples/echo_bot/Dockerfile
    restart: unless-stopped
    environment:
      APPSERVICE_CONFIG: examples/echo_bot/config/appservice.yml
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - 9292:9292
