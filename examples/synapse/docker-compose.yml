services:
  # ── Synapse Homeserver ────────────────────────────────────
  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./files:/data
    ports:
      - 8008:8008
      - 8448:8448
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Echo Bot (Appservice) ───────────────────────────────
  bot:
    build:
      context: ../..
      dockerfile: examples/synapse/Dockerfile
    restart: unless-stopped
    environment:
      APPSERVICE_CONFIG: examples/synapse/config/appservice.yml
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - 9292:9292

  # ── FluffyChat Web Client ─────────────────────────────────
  fluffychat:
    image: ghcr.io/etkecc/fluffychat-web:v2.5.1
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./fluffychat.config.json:/home/sws/public/config.json:ro

  # ── Reverse Proxy (HTTPS for client + homeserver) ───────────
  proxy:
    image: docker.io/nginx:alpine
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      fluffychat:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - 443:443


